<svg xmlns="http://www.w3.org/2000/svg" width="800" height="196" viewBox="0 0 800 196" role="img" aria-label="Stack: HTML5, CSS3, JavaScript, Python, Cyber Security. Clique para abrir o inventário.">
<style>
  text { font-family: 'Courier New', Consolas, monospace; white-space: pre; }
  .path { fill: #00C832; font-size: 13px; }
  .cnt { fill: #007A1F; font-size: 12px; letter-spacing: 1px; text-anchor: end; }
  .lbl { fill: #00A82B; font-size: 12px; text-anchor: middle; }
  .cta { fill: #00FF41; font-size: 14px; font-weight: bold; letter-spacing: 1px; filter: url(#glow2); }
  .ready { fill: #007A1F; font-size: 12px; letter-spacing: 1px; text-anchor: end; }
  .hop { animation: hop 5s steps(1) infinite; }
  .cur { animation: blink 1s steps(1) infinite; }
  .arrow { animation: nudge 1.4s ease-in-out infinite; }
  .scan { animation: scan 3.5s linear infinite; }
  @keyframes hop { 0% { transform: translateX(0px); } 20% { transform: translateX(114px); } 40% { transform: translateX(228px); } 60% { transform: translateX(342px); } 80% { transform: translateX(456px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(196px); } }
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
