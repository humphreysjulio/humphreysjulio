  </linearGradient>
  <radialGradient id="hl"><stop offset="0" stop-color="#00FF41" stop-opacity=".28"/><stop offset="1" stop-color="#00FF41" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="1" y="1" width="798" height="194" rx="10"/></clipPath>
</defs>
