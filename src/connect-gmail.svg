  .kk { fill: #050805; font-weight: bold; }
  .ring { animation: r 3s ease-out 0.0s infinite; transform-origin: 33px 64px; }
  @keyframes r { 0% { transform: scale(.8); opacity: .8; } 100% { transform: scale(1.45); opacity: 0; } }
</style>
