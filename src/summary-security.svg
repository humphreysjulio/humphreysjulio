<svg xmlns="http://www.w3.org/2000/svg" width="800" height="38" viewBox="0 0 800 38" role="img" aria-label="security/ — 1 módulo">
<style>
  text { font-family: 'Courier New', Consolas, monospace; white-space: pre; }
  .t { font-size: 15px; fill: #007A1F; }
  .n { font-size: 15px; font-weight: bold; fill: #00FF41; filter: url(#glow); }
  .i { font-size: 12px; fill: #00A82B; }
  .k { font-size: 11px; font-weight: bold; fill: #00FF41; letter-spacing: 2px; text-anchor: middle; }
  .p { animation: p 2.4s ease-in-out 0.9s infinite; }
  @keyframes p { 0%, 100% { stroke-opacity: .25; fill-opacity: .04; } 50% { stroke-opacity: .9; fill-opacity: .14; } }
</style>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
