<svg xmlns="http://www.w3.org/2000/svg" width="830" height="182" viewBox="0 0 830 182" role="img" aria-label="~/skills/security: cyber-security">
<style>
  text { font-family: 'Courier New', Consolas, monospace; white-space: pre; }
  .path { fill: #00C832; font-size: 13px; }
  .cnt { fill: #007A1F; font-size: 12px; letter-spacing: 1px; text-anchor: end; }
  .name { fill: #E6FFE6; font-size: 17px; font-weight: bold; }
  .desc { fill: #00A82B; font-size: 12px; }
  .st { fill: #00FF41; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
  .tile { animation: pulse 3s ease-in-out infinite; }
  .ico { filter: url(#glow); }
  .cur { animation: blink 1s steps(1) infinite; }
  .scan { animation: scan 4s linear infinite; }
  @keyframes pulse { 0%, 100% { stroke-opacity: .25; } 50% { stroke-opacity: .9; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(182px); } }
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
    <stop offset="1" stop-color="#00FF41" stop-opacity=".10"/>
  </linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00FF41" stop-opacity=".09"/>
    <stop offset="1" stop-color="#00FF41" stop-opacity=".01"/>
  </linearGradient>
  <clipPath id="c"><rect x="1" y="1" width="828" height="180" rx="10"/></clipPath>
</defs>
<rect x=".5" y=".5" width="829" height="181" rx="10" fill="#050805" stroke="#00FF41" stroke-opacity=".6"/>
