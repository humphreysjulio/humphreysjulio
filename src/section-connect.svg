<svg xmlns="http://www.w3.org/2000/svg" width="830" height="46" viewBox="0 0 830 46" role="img" aria-label="&gt; ./connect.sh">
<style>
  text { font-family: 'Courier New', Consolas, monospace; }
  .l { font-size: 18px; font-weight: bold; fill: #00FF41; filter: url(#glow); }
  .i { font-size: 12px; fill: #FF1A3C; text-anchor: end; }
  .pulse { animation: run 3.2s cubic-bezier(.6, 0, .4, 1) infinite; }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes run { from { transform: translateX(-120px); } to { transform: translateX(608px); } }
  .node { animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<defs>
  <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="pg" x1="0" x2="1">
    <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
    <stop offset="1" stop-color="#00FF41"/>
  </linearGradient>
  <clipPath id="ln"><rect x="184.7" y="0" width="597.1" height="46"/></clipPath>
</defs>
<path d="M1.5 10 V36 M1.5 10 H9.5 M1.5 36 H9.5" stroke="#00FF41" stroke-width="2" fill="none"/>
